name: CD - Terraform Plan & Apply

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
      tag:
        description: 'Image tag to deploy (for manifest update only)'
        required: false
        type: string

jobs:
  # -----------------------------------------------------------------------
  # Terraform Plan — runs automatically on every push
  # -----------------------------------------------------------------------
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'terraform-sa@utila-eliran-home.iam.gserviceaccount.com'

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: tfplan
          retention-days: 1

  # -----------------------------------------------------------------------
  # Terraform Apply — MANUAL ONLY via workflow_dispatch with action=apply
  # -----------------------------------------------------------------------
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: terraform-plan
    # Only run when manually triggered with action=apply
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'
    environment: production  # Requires manual approval in GitHub repo settings
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'terraform-sa@utila-eliran-home.iam.gserviceaccount.com'

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

  # -----------------------------------------------------------------------
  # Update Kubernetes manifests with new image tag — MANUAL ONLY
  # -----------------------------------------------------------------------
  update-manifests:
    name: Update Image Tag
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.tag != ''
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update image tag in manifests
        run: |
          sed -i "s|image:.*greeter.*|image: us-central1-docker.pkg.dev/utila-eliran-home/greeter/greeter:${{ github.event.inputs.tag }}|g" manifests/server.yaml
          sed -i "s|image:.*greeter.*|image: us-central1-docker.pkg.dev/utila-eliran-home/greeter/greeter:${{ github.event.inputs.tag }}|g" manifests/client.yaml

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update image tag to ${{ github.event.inputs.tag }}"
          branch: main
