apiVersion: apps/v1
kind: Deployment
metadata:
  name: greeter-client
  namespace: grpc-proxyless
  labels:
    app: greeter-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: greeter-client
  template:
    metadata:
      labels:
        app: greeter-client
      annotations:
        # Required for GKE Cloud Service Mesh proxyless gRPC injection.
        # This annotation tells the GKE mesh dataplane to inject the xDS
        # bootstrap config into the pod via GRPC_XDS_BOOTSTRAP env var.
        security.cloud.google.com/use-workload-certificates: "true"
    spec:
      serviceAccountName: greeter-service-account
      containers:
      - name: greeter-client
        image: us-central1-docker.pkg.dev/utila-eliran-home/greeter/greeter:latest
        command: ["/client"]
        env:
        # The xDS bootstrap config file path is injected by the GKE mesh
        # dataplane init container when the annotation above is set.
        # This env var tells the gRPC xDS library where to find the config.
        - name: GRPC_XDS_BOOTSTRAP
          value: /var/run/secrets/workload-spiffe-credentials/bootstrap.json
        resources:
          requests:
            cpu: "50m"
            memory: "32Mi"
          limits:
            cpu: "200m"
            memory: "64Mi"
