apiVersion: apps/v1
kind: Deployment
metadata:
  name: greeter-server
  namespace: grpc-proxyless
  labels:
    app: greeter-server
spec:
  replicas: 3
  selector:
    matchLabels:
      app: greeter-server
  template:
    metadata:
      labels:
        app: greeter-server
      annotations:
        # Required for GKE Cloud Service Mesh proxyless gRPC injection.
        # This annotation tells the GKE mesh dataplane to inject the xDS
        # bootstrap config into the pod via GRPC_XDS_BOOTSTRAP env var.
        security.cloud.google.com/use-workload-certificates: "true"
    spec:
      serviceAccountName: greeter-service-account
      containers:
      - name: greeter-server
        image: us-central1-docker.pkg.dev/utila-eliran-home/greeter/greeter:latest
        ports:
        - name: grpc
          containerPort: 50051
          protocol: TCP
        env:
        # The xDS bootstrap config file path is injected by the GKE mesh
        # dataplane init container when the annotation above is set.
        # This env var tells the gRPC xDS library where to find the config.
        - name: GRPC_XDS_BOOTSTRAP
          value: /var/run/secrets/workload-spiffe-credentials/bootstrap.json
        resources:
          requests:
            cpu: "100m"
            memory: "64Mi"
          limits:
            cpu: "500m"
            memory: "128Mi"
        readinessProbe:
          grpc:
            port: 50051
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          grpc:
            port: 50051
          initialDelaySeconds: 10
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: greeter-service
  namespace: grpc-proxyless
spec:
  selector:
    app: greeter-server
  ports:
    - name: grpc
      protocol: TCP
      port: 50051
      targetPort: 50051
  clusterIP: None # Headless service required for Traffic Director endpoint discovery
