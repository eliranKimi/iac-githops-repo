apiVersion: apps/v1
kind: Deployment
metadata:
  name: greeter-server
  namespace: grpc-proxyless
  labels:
    app: greeter-server
spec:
  replicas: 3
  selector:
    matchLabels:
      app: greeter-server
  template:
    metadata:
      labels:
        app: greeter-server
    spec:
      serviceAccountName: greeter-service-account
      containers:
      - name: greeter-server
        image: us-central1-docker.pkg.dev/utila-eliran-home/greeter/greeter:latest
        ports:
        - containerPort: 50051
---
apiVersion: v1
kind: Service
metadata:
  name: greeter-service
  namespace: grpc-proxyless
spec:
  selector:
    app: greeter-server
  ports:
    - protocol: TCP
      port: 50051
      targetPort: 50051
  clusterIP: None # Headless service
